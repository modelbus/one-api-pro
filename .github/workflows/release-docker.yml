name: release-docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Leave empty to use the pushed tag."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-push:
    name: Build & push multi-arch Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize tag (auto-prefix v)
        id: tag
        run: |
          raw="${{ env.TAG }}"
          case "$raw" in
            v*) normalized="$raw" ;;
            *)   normalized="v$raw" ;;
          esac
          if [ -z "$raw" ]; then
            echo "::error::Tag is empty. Pass a tag via push (v*) or workflow_dispatch input."
            exit 1
          fi
          if ! [[ "$normalized" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Tag '$raw' (normalized to '$normalized') does not look like a semver tag (vX.Y.Z)."
            exit 1
          fi
          echo "normalized=$normalized" >> "$GITHUB_OUTPUT"
          echo "Release tag: $normalized"

      - name: Verify CHANGELOG exists
        env:
          TAG: ${{ steps.tag.outputs.normalized }}
        run: |
          SRC="CHANGELOG/${TAG}.md"
          if [ ! -f "$SRC" ]; then
            echo "::error::CHANGELOG file not found: $SRC"
            echo "Every released tag must have a matching CHANGELOG/<tag>.md before tagging."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=auto：仅当 tag 不含预发布后缀（-rc/-alpha/-beta 等）时打 latest
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=one-api-pro
            org.opencontainers.image.description=One API Pro - OpenAI API management & relay
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.tag.outputs.normalized }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PKG_NAME=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          OWNER_TYPE=$(gh api "/repos/${OWNER}/${REPO}" --jq '.owner.type')
          case "$OWNER_TYPE" in
            User)         ENDPOINT="/users/${OWNER}/packages/container/${PKG_NAME}" ;;
            Organization) ENDPOINT="/orgs/${OWNER}/packages/container/${PKG_NAME}" ;;
            *)            echo "::warning::Unknown owner type '$OWNER_TYPE', skip."; exit 0 ;;
          esac
          echo "Setting ${ENDPOINT} visibility to public..."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "${ENDPOINT}" \
            -f visibility=public
